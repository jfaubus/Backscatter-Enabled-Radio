# --- Console / logging -------------------------------------------------------
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
# Immediate mode: if a QSPI activation hangs we still want the preceding lines
# out of the UART rather than stuck in a deferred log buffer.
CONFIG_LOG_MODE_IMMEDIATE=y

# --- nrfx drivers driven directly by the application -------------------------
CONFIG_NRFX_QSPI=y
CONFIG_NRFX_GPIOTE=y
CONFIG_NRFX_TIMER=y
CONFIG_NRFX_GPPI=y

# Zephyr's gpio_nrfx driver and ppi_fork.c both use nrfx_gpiote on the
# nRF52840's single GPIOTE instance. That is safe to share: nrfx tracks
# channel allocation in a module-global atomic mask (available_channels_mask
# in nrfx_gpiote.c) keyed by instance index, so both callers draw from the
# same pool of 8. Keep this on for sensors, SPI cs-gpios, LEDs and GPIO
# interrupts all need it.
CONFIG_GPIO=y

# QSPI is clocked from HFCLK128M, which is only available with the 32 MHz
# crystal running. qspi_pattern_init() requests it explicitly.
CONFIG_CLOCK_CONTROL=y
