# --- Console / logging -------------------------------------------------------
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
# Immediate mode: if a QSPI activation hangs we still want the preceding lines
# out of the UART rather than stuck in a deferred log buffer.
CONFIG_LOG_MODE_IMMEDIATE=y

# --- nrfx drivers driven directly by the application -------------------------
CONFIG_NRFX_QSPI=y

# Keep this on: sensors, SPI cs-gpios, LEDs and GPIO interrupts all need it.
CONFIG_GPIO=y

# QSPI is clocked from HFCLK128M, which is only available with the 32 MHz
# crystal running. qspi_pattern_init() requests it explicitly.
CONFIG_CLOCK_CONTROL=y
